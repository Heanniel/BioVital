<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Médico - BioVital</title>
    <meta name="description" content="Portal de acceso exclusivo para médicos de BioVital">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="theme-medico">
    <!-- Header Navigation -->
    <header class="header" id="header" style="position: static;">
        <nav class="navbar">
            <div class="nav-container">
                <div class="logo">
                    <a href="index.html">
                        <img src="https://via.placeholder.com/150x50/1e40af/ffffff?text=BioVital" alt="BioVital Logo" class="logo-img">
                    </a>
                </div>
                <ul class="nav-menu" id="navMenu">
                    <li class="nav-item">
                        <a href="index.html" class="nav-link">Inicio</a>
                    </li>
                </ul>
                <div class="hamburger" id="hamburger">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="auth-main">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <i class="fas fa-stethoscope fa-3x" style="color: var(--primary-color); margin-bottom: 1rem;"></i>
                    <h1>Portal Médico</h1>
                    <p>Accede a tus herramientas de consulta médica</p>
                </div>

                <form class="auth-form" id="loginForm" action="dashboard-medico.html">
                    <div class="form-group">
                        <label for="user">Credencial Médica / Usuario:</label>
                        <input type="text" id="user" name="user" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="pass">Contraseña:</label>
                        <input type="password" id="pass" name="pass" required>
                    </div>

                    <div class="form-options">
                        <div class="form-group">
                            <label>
                                <input type="checkbox" id="remember" name="remember">
                                Recordarme
                            </label>
                        </div>
                        <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn-secondary" onclick="window.location.href='index.html'">Cancelar</button>
                        <button type="submit" class="btn-primary">Iniciar Sesión</button>
                    </div>
                </form>

                <div class="role-switcher">
                    <a href="login.html" class="role-link">Paciente</a>
                    <a href="login-medico.html" class="role-link active">Médico</a>
                    <a href="login-asistente.html" class="role-link">Asistente</a>
                    <a href="login-secretaria.html" class="role-link">Secretaria</a>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-container">
            <div class="footer-bottom">
                <p>&copy; 2025 BioVital. Todos los derechos reservados.</p>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
